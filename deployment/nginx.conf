# NGINX reverse proxy configuration for Tara private same-origin HTTPS deployment.
# Routes REST API and WebSocket events to FastAPI on 127.0.0.1:8000 and web pages to Next.js on 127.0.0.1:3000.

server {
    listen 443 ssl http2;
    server_name tara.local;

    ssl_certificate /etc/ssl/certs/tara.crt;
    ssl_certificate_key /etc/ssl/private/tara.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # REST API endpoints
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Authenticated WebSocket endpoints
    location /ws/v1/ {
        proxy_pass http://127.0.0.1:8000/ws/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Next.js web application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
